# A API ainda nao traz o cadastro de colaboradores. Uma vez por dia (e pelo botao
# "Run workflow"), entra no mapeia, exporta os Usuarios da empresa e atualiza
# dados/usuarios.json (so nome, cargo, setor, perfil e status).
name: Atualizar lista de usuarios

on:
  schedule:
    - cron: "30 9 * * *"   # 06:30 em Brasilia
  workflow_dispatch:
  push:                    # roda quando o robo de usuarios e alterado
    branches: [main]
    paths:
      - painel/baixar_usuarios.py
      - .github/workflows/atualizar-usuarios.yml

permissions:
  contents: write

concurrency:
  group: usuarios
  cancel-in-progress: false

jobs:
  usuarios:
    if: github.event_name != 'schedule' || vars.PAINEL_ATIVO == 'true'
    runs-on: ubuntu-24.04   # fixo: o ubuntu-latest esta migrando de versao
    env:
      TZ: America/Sao_Paulo
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar navegador
        run: |
          pip install openpyxl playwright
          for t in 1 2 3; do
            python -m playwright install --with-deps chromium && exit 0
            echo "instalacao falhou (tentativa $t), tentando de novo..."; sleep 20
          done
          exit 1

      - name: Baixar usuarios do mapeia
        env:
          MAPEIA_EMAIL: ${{ secrets.MAPEIA_EMAIL }}
          MAPEIA_SENHA: ${{ secrets.MAPEIA_SENHA }}
        run: python painel/baixar_usuarios.py

      - name: Salvar se mudou
        run: |
          if git diff --quiet -- dados/usuarios.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/usuarios.json
          git commit -m "Usuarios atualizados"
          git push
