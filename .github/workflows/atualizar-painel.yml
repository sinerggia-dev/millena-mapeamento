# Busca as atividades na API do mapeia, gera o painel e publica no GitHub Pages.
# Roda a cada 10 min das 07h as 21h (Brasilia) e pelo botao "Run workflow".
name: Atualizar painel

on:
  schedule:
    - cron: "*/10 10-23 * * *"   # UTC = 07:00-20:59 em Brasilia
  workflow_dispatch:
  push:                    # publica na hora quando o painel ou a lista de usuarios mudam
    branches: [main]
    paths:
      - painel/**
      - portal/**
      - .github/workflows/atualizar-painel.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: painel
  cancel-in-progress: false

jobs:
  atualizar:
    # Liga/desliga o agendamento: existir a variavel PAINEL_ATIVO (qualquer valor) liga; apagar desliga.
    # O botao "Run workflow" funciona sempre.
    if: github.event_name != 'schedule' || vars.PAINEL_ATIVO != ''
    runs-on: ubuntu-24.04   # fixo: o ubuntu-latest esta migrando de versao
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: America/Sao_Paulo
      BROWSER: "true"          # o gerador tenta abrir o navegador; aqui nao faz nada
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install openpyxl

      # "Novas atividades HOJE" compara com a execucao anterior
      - uses: actions/cache/restore@v4
        with:
          path: trabalho/ResumoGerencialMapeamentoMillena/estado_anterior.json
          key: estado-${{ github.run_id }}
          restore-keys: estado-

      - name: Buscar atividades na API
        env:
          MAPEIA_API_KEY: ${{ secrets.MAPEIA_API_KEY }}
        run: python painel/buscar_api.py trabalho

      - name: Gerar painel
        run: python trabalho/ResumoGerencialMapeamentoMillena/gerar_dashboard.py

      - run: |
          mkdir -p _site
          cp trabalho/ResumoGerencialMapeamentoMillena/Dashboard_Millena_ATUAL.html _site/index.html
          cp painel/pwa/* _site/   # icones e manifesto para instalar no celular
          mkdir -p _site/portal && cp portal/index.html _site/portal/ && cp painel/pwa/* _site/portal/   # portal com login (fase de teste)

      - name: Guardar o painel na area privada (Supabase)
        env:
          SUPABASE_URL: https://dcdbsiuveisxoypcblzd.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_KEY" ]; then echo "::warning::segredo SUPABASE_SERVICE_KEY ainda nao configurado"; exit 0; fi
          code=$(curl -s -o resp.txt -w "%{http_code}" -X POST "$SUPABASE_URL/storage/v1/object/paineis/millena/index.html"             -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY"             -H "x-upsert: true" -H "Content-Type: text/html; charset=utf-8" -H "Cache-Control: no-cache"             --data-binary @_site/index.html)
          if [ "$code" -ge 300 ]; then echo "::error::Supabase respondeu $code: $(head -c 300 resp.txt)"; exit 1; fi
          echo "::notice::Painel guardado na area privada (HTTP $code)"

      - uses: actions/cache/save@v4
        with:
          path: trabalho/ResumoGerencialMapeamentoMillena/estado_anterior.json
          key: estado-${{ github.run_id }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
